[project]
name = "acidmom"
version = "0.1.0"
description = "Rastreador global de acidentes no transporte marítimo de cargas"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3",
    "feedparser>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
acidmom = "acidmom.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
