name: Rastreador

on:
  workflow_dispatch:
    inputs:
      comando:
        description: "Comando a rodar"
        type: choice
        options: [rodar, semanal]
        default: rodar

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Testar GDELT
        run: |
          q() { echo "== $1"; curl -sS -m 40 -G 'https://api.gdeltproject.org/api/v2/doc/doc' --data-urlencode "query=$1" -d mode=artlist -d format=json -d maxrecords=50 -d "timespan=$2" -o out.txt -w 'HTTP %{http_code} %{content_type} %{size_download}B\n'; head -c 300 out.txt; echo; python3 -c "import json;d=json.load(open('out.txt'));print('artigos:',len(d.get('articles',[])))" 2>/dev/null || echo "(não é JSON)"; sleep 12; }
          q 'tanker' 24h
          q '"bulk carrier"' 3d
          q '("cargo ship" OR "bulk carrier" OR "container ship" OR tanker OR freighter) (collision OR aground OR grounding OR fire OR explosion OR sank OR capsized OR "abandon ship")' 24h
          q '("cargo ship" OR "bulk carrier" OR "container ship" OR tanker OR freighter) (collision OR aground OR grounding OR fire OR explosion OR sank OR capsized OR "abandon ship")' 3d
          q '(navio OR graneleiro OR petroleiro) (colisão OR encalhe OR incêndio OR naufrágio)' 3d
          q 'ship aground sourcelang:english' 3d
