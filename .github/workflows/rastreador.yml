name: Rastreador

on:
  schedule:
    # Minuto 17, e não 0: na virada da hora o GitHub fica sobrecarregado e atrasa ou pula rodadas.
    # O GitHub atrasa ou pula agendamentos; por isso cada rodada também dispara a próxima
    # (job "proxima", no fim). O agendamento fica como reserva, caso a corrente pare.
    - cron: "17 * * * *"   # de hora em hora: coletar, processar e avisar
    - cron: "17 11 * * 1"  # segundas, 8h17 de Brasília: relatório semanal
  workflow_dispatch:
    inputs:
      comando:
        description: "Comando a rodar"
        type: choice
        options: [rodar, semanal]
        default: rodar

permissions:
  contents: write
  pages: write     # publicar o mapa no GitHub Pages
  id-token: write

concurrency:
  group: rastreador
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.mapa.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install .

      # O banco SQLite fica guardado no branch "dados", separado do código.
      - name: Baixar o banco
        run: |
          mkdir -p data
          if git fetch --depth=1 origin dados; then
            git show origin/dados:acidmom.sqlite > data/acidmom.sqlite
          fi

      - name: Rodar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ACIDMOM_MODEL: ${{ vars.ACIDMOM_MODEL }}
        run: |
          if [ "${{ github.event.schedule }}" = "17 11 * * 1" ]; then
            acidmom semanal
          else
            acidmom "${{ inputs.comando || 'rodar' }}"
          fi

      - name: Guardar o banco
        run: |
          git config user.name "acid-mom bot"
          git config user.email "acid-mom@users.noreply.github.com"
          cp data/acidmom.sqlite /tmp/acidmom.sqlite
          if git rev-parse --verify -q origin/dados; then
            git worktree add /tmp/dados origin/dados
          else
            git worktree add --detach /tmp/dados
            git -C /tmp/dados checkout --orphan dados-novo
            git -C /tmp/dados rm -rfq --ignore-unmatch .
          fi
          cp /tmp/acidmom.sqlite /tmp/dados/acidmom.sqlite
          cd /tmp/dados
          git add acidmom.sqlite
          git commit -qm "Banco atualizado em $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git push origin HEAD:dados

      # O mapa (site/index.html) é publicado no GitHub Pages a cada rodada.
      - name: Preparar o mapa
        if: hashFiles('site/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar o mapa
        id: mapa
        if: hashFiles('site/index.html') != ''
        uses: actions/deploy-pages@v4

  # Espera até o minuto 17 da hora seguinte e dispara a próxima rodada, a não ser que já haja
  # outra na fila (por exemplo, uma do agendamento): assim só existe uma corrente de rodadas.
  proxima:
    needs: rodar
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Esperar a próxima hora
        run: |
          agora=$(date -u +%s)
          alvo=$(( (agora / 3600 + 1) * 3600 + 17 * 60 ))
          if [ $(( alvo - agora )) -gt 3600 ]; then alvo=$(( alvo - 3600 )); fi
          echo "Próxima rodada às $(date -u -d @$alvo +%H:%M) UTC"
          sleep $(( alvo - agora ))

      - name: Disparar a próxima rodada
        run: |
          outras=$(gh run list --workflow rastreador.yml --limit 20 --json databaseId,status \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }} and .status != \"completed\")] | length")
          if [ "$outras" -gt 0 ]; then
            echo "Já há outra rodada na fila; ela continua a corrente."
          else
            gh workflow run rastreador.yml -f comando=rodar
          fi
