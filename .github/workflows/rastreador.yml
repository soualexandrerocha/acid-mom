name: Rastreador

on:
  workflow_dispatch:
    inputs:
      comando:
        description: "Comando a rodar"
        type: choice
        options: [rodar, semanal]
        default: rodar

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Testar buscas
        run: |
          f() { echo "== $1"; curl -sSL -m 30 "$2" -o out.txt -w 'HTTP %{http_code} %{size_download}B\n'; python3 -c "import re,html;t=open('out.txt',errors='ignore').read();it=re.findall(r'<item><title>(.*?)</title>',t,re.S);print('itens:',len(it));[print('  ',html.unescape(x)[:120]) for x in it[:5]]"; sleep 2; }
          f 'espanhol' 'https://news.google.com/rss/search?q=(buque%20OR%20carguero%20OR%20petrolero%20OR%20portacontenedores%20OR%20granelero)%20(encalla%20OR%20encallado%20OR%20colisi%C3%B3n%20OR%20incendio%20OR%20naufragio%20OR%20hundimiento%20OR%20explosi%C3%B3n%20OR%20%22a%20la%20deriva%22)%20when%3A1d&hl=es&gl=ES&ceid=ES:es'
          f 'alemão' 'https://news.google.com/rss/search?q=(Frachter%20OR%20Containerschiff%20OR%20Tanker%20OR%20Massengutfrachter%20OR%20Frachtschiff%20OR%20Schiff)%20(Kollision%20OR%20kollidiert%20OR%20gerammt%20OR%20rammt%20OR%20Havarie%20OR%20Brand%20OR%20Feuer%20OR%20gesunken%20OR%20%22auf%20Grund%20gelaufen%22%20OR%20Explosion)%20when%3A1d&hl=de&gl=DE&ceid=DE:de'
          f 'francês' 'https://news.google.com/rss/search?q=(cargo%20OR%20%22porte-conteneurs%22%20OR%20p%C3%A9trolier%20OR%20vraquier%20OR%20navire)%20(collision%20OR%20%C3%A9chou%C3%A9%20OR%20%C3%A9chouement%20OR%20incendie%20OR%20naufrage%20OR%20explosion%20OR%20%22%C3%A0%20la%20d%C3%A9rive%22%20OR%20coul%C3%A9)%20when%3A1d&hl=fr&gl=FR&ceid=FR:fr'
          f 'italiano' 'https://news.google.com/rss/search?q=(nave%20OR%20portacontainer%20OR%20petroliera%20OR%20mercantile%20OR%20portarinfuse)%20(collisione%20OR%20incagliata%20OR%20incendio%20OR%20naufragio%20OR%20esplosione%20OR%20%22alla%20deriva%22%20OR%20affondata)%20when%3A1d&hl=it&gl=IT&ceid=IT:it'
